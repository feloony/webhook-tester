<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook Tester</title><link rel="stylesheet" href="style.css"></head><body><header><b>◈ Webhook Tester</b><span>LOCAL INSPECTOR</span><a href="https://github.com/feloony/webhook-tester">GitHub</a></header><main><section class="hero"><span>WEBHOOK DEBUGGING</span><h1>Inspect every<br><i>payload.</i></h1><p>Compose, inspect and replay webhook-style requests with a clean developer workspace. No account required.</p></section><section class="app"><aside><div class="head"><b>Incoming request</b><button id="simulate">Simulate</button></div><label>METHOD<select id="method"><option>POST</option><option>PUT</option><option>PATCH</option></select></label><label>PATH<input id="path" value="/webhook/demo"></label><label>HEADERS<textarea id="headers">Content-Type: application/json\nUser-Agent: WebhookTester/1.0</textarea></label><label>BODY<textarea id="body">{
  "event": "user.created",
  "id": 42,
  "email": "demo@example.com"
}</textarea></label></aside><section class="log"><div class="head"><b>Request log</b><button id="clear">Clear</button></div><div id="empty">No requests yet.<br>Click <b>Simulate</b> to inspect a webhook payload.</div><div id="detail" class="hidden"></div></section></section></main><script src="app.js"></script></body></html>
